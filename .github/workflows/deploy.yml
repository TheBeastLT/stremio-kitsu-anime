name: Deploy

on:
  push:
    branches: [master]
  # Pushes made with GITHUB_TOKEN (the scheduled mapping import) don't trigger `push`, so that workflow dispatches this.
  workflow_dispatch:
    inputs:
      before:
        description: Commit deployed before, to clear the cache of mappings changed since
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        id: golden
        with:
          path: |
            search_eval/golden/norm.jsonl
            search_eval/golden/parse_query.jsonl
            search_eval/golden/search.jsonl
            search_eval/golden/candidates.jsonl
            search_eval/golden/jw.jsonl
            search_eval/golden/log.jsonl
            search_eval/golden/index.json
            search_eval/golden/entries.jsonl
            search_eval/golden/trigrams.json
            search_eval/golden/SHA256SUMS
          key: golden-${{ runner.os }}-${{ hashFiles('lib/**', 'static/data/**', 'search_eval/**', 'package-lock.json') }}

      - if: steps.golden.outputs.cache-hit != 'true'
        run: node search_eval/golden/dump.js
        env:
          FANART_APIKEY: test
          NO_CACHE: "true"

      - run: node search_eval/golden/kernel_sweep.js > search_eval/golden/kernel_sweep.json

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

      - run: cargo test --workspace --release --target x86_64-unknown-linux-musl

  build-and-deploy:
    needs: [test, check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=anime-kitsu
          cache-to: type=gha,scope=anime-kitsu,mode=max
          push: true
          tags: |
            ghcr.io/thebeastlt/anime-kitsu:${{ github.sha }}
            ghcr.io/thebeastlt/anime-kitsu:latest

      - name: Rolling update on the swarm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker service update --detach=false --update-failure-action pause --with-registry-auth \
              --image ghcr.io/thebeastlt/anime-kitsu:${{ github.sha }} \
              kitsu_addon

      - name: Find changed mappings
        id: mapping
        env:
          BEFORE: ${{ github.event.before || inputs.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && ! git diff --quiet "$BEFORE" HEAD -- static/data/imdb_mapping.json; then
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mapping.outputs.before
        with:
          node-version: 22
          cache: npm

      - name: Clear cache of changed mappings
        if: steps.mapping.outputs.before
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm ci
          node mapping/clear_mapping_cache.js ${{ steps.mapping.outputs.before }} HEAD --delete
