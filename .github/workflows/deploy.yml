name: Deploy

on:
  push:
    branches: [master]
  # Pushes made with GITHUB_TOKEN (the scheduled mapping import) don't trigger `push`, so that workflow dispatches this.
  workflow_dispatch:
    inputs:
      before:
        description: Commit deployed before, to clear the cache of mappings changed since
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          cache-from: type=gha,scope=anime-kitsu
          cache-to: type=gha,scope=anime-kitsu,mode=max
          push: true
          tags: |
            ghcr.io/thebeastlt/anime-kitsu:${{ github.sha }}
            ghcr.io/thebeastlt/anime-kitsu:latest

      - name: Rolling update on the swarm
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          key: ${{ secrets.SSH_KEY }}
          username: ${{ secrets.SSH_USERNAME }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker service update --detach=false --update-failure-action pause --with-registry-auth \
              --image ghcr.io/thebeastlt/anime-kitsu:${{ github.sha }} \
              kitsu_addon

      - name: Find changed mappings
        id: mapping
        env:
          BEFORE: ${{ github.event.before || inputs.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
              && ! git diff --quiet "$BEFORE" HEAD -- static/data/imdb_mapping.json; then
            echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.mapping.outputs.before
        with:
          node-version: 22
          cache: npm

      - name: Clear cache of changed mappings
        if: steps.mapping.outputs.before
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm ci
          node mapping/clear_mapping_cache.js ${{ steps.mapping.outputs.before }} HEAD --delete
