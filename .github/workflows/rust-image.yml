name: Rust image

on:
  push:
    branches: [rust-port]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rust
          cache-from: type=gha,scope=anime-kitsu-rs
          cache-to: type=gha,scope=anime-kitsu-rs,mode=max
          push: true
          tags: ghcr.io/thebeastlt/anime-kitsu-rs:${{ github.sha }}
