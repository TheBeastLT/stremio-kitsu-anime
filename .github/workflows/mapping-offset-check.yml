name: Check mapping offsets

# Weekly: re-checks the IMDb offsets of sequels, continuation cours and specials that started in the last two MAL
# seasons against fresh Cinemeta data. Mismatches are kept in one open issue, which is closed once all match again.
on:
  schedule:
    - cron: '0 5 * * 4' # Thursdays 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check offsets
        id: check
        env:
          FANART_APIKEY: ${{ secrets.FANART_APIKEY }}
        run: |
          node mapping/offset_check.js 2 report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update issue
        env:
          GH_TOKEN: ${{ github.token }}
          MISMATCHES: ${{ steps.check.outputs.mismatches }}
        run: |
          title='Mapping offsets no longer match Cinemeta'
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "$MISMATCHES" != "0" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file report.md
            elif [ "$(gh issue view "$number" --json body --jq .body)" != "$(cat report.md)" ]; then
              gh issue edit "$number" --body-file report.md
              gh issue comment "$number" --body "Updated: $MISMATCHES mismatching rows."
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment 'All recent offsets match Cinemeta again.'
          fi
