[package]
name = "kitsu-addon"
description = "Kitsu anime Stremio addon server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kitsu_addon"

[[bin]]
name = "kitsu-addon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
fastjs-regex = "0.1"
futures = "0.3"
indexmap = "2.14.2"
kitsu-search = { path = "../kitsu-search" }
moka = { version = "0.12", features = ["future"] }
mimalloc = "0.1"
mongodb = { version = "3", features = ["zstd-compression"] }
prometheus = { version = "0.14", features = ["process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
singleflight-async = "0.2"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br", "compression-deflate", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
zstd = "0.13"

[dev-dependencies]
brotli-decompressor = "6"
flate2 = "1"
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
